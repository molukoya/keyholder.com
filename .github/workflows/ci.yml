# Checks every push and pull request: types, unit and API tests, the build, then the browser tests
# (the website on its own, and the website + app + API together against the real server).
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the browser for the end-to-end tests
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: End-to-end, website + app + API (real server)
        run: node scripts/e2e-server.cjs
      - name: End-to-end, every page and journey (browser-only mode)
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
          node scripts/ux-flow-test.cjs
