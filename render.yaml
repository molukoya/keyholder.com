# Render Blueprint (Stage 2): the Keyholder web service (website + app + API, with the email sender and
# daily jobs inside it) and a managed Postgres database. In Render: New → Blueprint → pick this repository.
# Render asks for the values marked `sync: false` (the first admin's email and password, 10+ characters;
# the team then signs in with that email, or the username "admin", and that password).
# See docs/BACKEND.md for every setting, and how to switch on real email.
services:
  - type: web
    name: keyholder
    runtime: node
    plan: free
    # --include=dev: Render sets NODE_ENV=production during the build too, which would skip the build tools.
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Toronto
      - key: DATABASE_URL
        fromDatabase:
          name: keyholder-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_PROVIDER
        value: log
      - key: EMAIL_FROM
        value: Keyholder <hello@keyholder.ca>
      - key: WORKER
        value: inline
      - key: DAILY_HOUR
        value: "9"

databases:
  - name: keyholder-db
    plan: free
    databaseName: keyholder
    user: keyholder
